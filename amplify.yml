version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install "$(cat .nvmrc)"
        - nvm use "$(cat .nvmrc)"
        - node --version
        - npm --version
        - npm ci --engine-strict --no-audit --no-fund
        - npm run lint
        - npm test
    build:
      commands:
        - env | grep -E "BLUESKY_|MASTODON_|NEXTAUTH_|GOOGLE_|ADMIN_|DYNAMO" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
